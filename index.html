<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кино на вечер">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Кино на вечер</title>
<style>
:root{--bg:#14111c;--card:#1f1a2b;--line:#33294a;--text:#f1edf7;--muted:#a79fbd;--acc:#ff8a5c;--acc2:#ffc46b;--ok:#7fd6a5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 8px;position:sticky;top:0;background:rgba(20,17,28,.96);backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
main{padding:12px 14px calc(30px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
input[type=search]{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 2px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a0f08;font-weight:600}
.bar{display:flex;gap:8px;margin:14px 0 4px}
.btn{flex:1;font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px;background:var(--line);color:var(--text)}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0f08}
.btn:active,.chip:active{transform:scale(.97)}
.count{color:var(--muted);font-size:13px;margin:10px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card.hl{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(255,196,107,.35)}
.card h3{margin:0;font-size:18px}
.orig{color:var(--muted);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12px;border-radius:999px;padding:3px 9px;background:#2a2340;color:#d8d0ea}
.tag.m{background:#3a2a2a;color:#ffd2bd}
.tag.t{background:#203a30;color:#bff0d6}
.card p{margin:6px 0 10px;color:#ddd6ea}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button,.acts a{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:7px 10px;text-decoration:none}
.acts button.on{background:var(--ok);border-color:var(--ok);color:#0d2418;font-weight:600}
.acts button.want.on{background:var(--acc2);border-color:var(--acc2);color:#2a1a00}
.card.seen{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:10px}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>🍿 Кино на вечер</h1>
  <div class="sub" id="sub">Захватывающие фильмы и короткие сериалы для вечера вдвоём</div>
  <input type="search" id="q" placeholder="Поиск по названию или описанию">
</header>
<main>
  <div class="lbl">Настроение</div>
  <div class="chips" id="moods"></div>
  <div class="lbl">Жанр</div>
  <div class="chips" id="genres"></div>
  <div class="lbl">Формат</div>
  <div class="chips" id="formats"></div>
  <div class="lbl">Список</div>
  <div class="chips" id="lists"></div>
  <label class="toggle"><input type="checkbox" id="hideSeen"> Скрыть уже просмотренное</label>

  <div class="bar">
    <button class="btn main" id="random">🎲 Выбрать за нас</button>
    <button class="btn" id="reset">Сбросить</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<script>
// t — название, o — оригинал, y — год, k — film|series, min — длительность (для сериалов — суммарно),
// ev — сколько вечеров (1 / 2 / 3 / 'ep' = одна серия = один вечер), g — жанры, m — настроения, d — описание
window.KINO = [
// ---------- ТРИЛЛЕРЫ И ДЕТЕКТИВЫ ----------
{t:"Исчезнувшая",o:"Gone Girl",y:2014,k:"film",min:149,ev:1,g:["Триллер","Детектив"],m:["На краю дивана","Обсудить после"],d:"В годовщину свадьбы пропадает жена, и все подозрения падают на мужа. Финчер раскручивает историю так, что к середине вы перестаёте понимать, кому верить. Идеально для пары — спорить после титров гарантировано."},
{t:"Достать ножи",o:"Knives Out",y:2019,k:"film",min:130,ev:1,g:["Детектив","Комедия"],m:["На краю дивана","Легко и весело"],d:"Знаменитый автор детективов найден мёртвым после семейного праздника, а в доме — сплошь родственники с мотивами. Классический «кто убил» с юмором, отличным актёрским составом и честными подсказками."},
{t:"Достать ножи: Стеклянная луковица",o:"Glass Onion",y:2022,k:"film",min:139,ev:1,g:["Детектив","Комедия"],m:["Легко и весело","На краю дивана"],d:"Тот же сыщик на частном греческом острове миллиардера, где игра в убийство превращается в настоящее. Ярче и смешнее первой части, смотреть можно отдельно."},
{t:"Пленницы",o:"Prisoners",y:2013,k:"film",min:153,ev:1,g:["Триллер","Детектив","Драма"],m:["На краю дивана","Мрачно"],d:"Пропадают две девочки, отец одной из них решает действовать сам, пока детектив ищет по правилам. Тяжёлый, очень плотный триллер Вильнёва — держит до последней секунды."},
{t:"Остров проклятых",o:"Shutter Island",y:2010,k:"film",min:138,ev:1,g:["Триллер","Мистика"],m:["На краю дивана","Обсудить после"],d:"Два маршала приезжают на остров с клиникой для преступников, чтобы найти сбежавшую пациентку. Атмосфера сгущается, а финал заставляет пересобрать весь фильм в голове."},
{t:"Невидимый гость",o:"Contratiempo",y:2016,k:"film",min:106,ev:1,g:["Триллер","Детектив"],m:["На краю дивана"],d:"Бизнесмен, обвинённый в убийстве, за одну ночь должен выстроить с адвокатом безупречную версию защиты. Испанский триллер-головоломка с поворотом за поворотом, без единой провисающей минуты."},
{t:"Тело",o:"El cuerpo",y:2012,k:"film",min:108,ev:1,g:["Триллер","Детектив"],m:["На краю дивана"],d:"Из морга исчезает тело влиятельной женщины, а её мужа вызывают на допрос. Одна ночь, одно здание, нарастающее напряжение — от того же режиссёра, что и «Невидимый гость»."},
{t:"Секрет в их глазах",o:"El secreto en sus ojos",y:2009,k:"film",min:129,ev:1,g:["Детектив","Драма","Мелодрама"],m:["Обсудить после","Романтично"],d:"Бывший следователь пишет роман о старом деле об убийстве, которое не отпускает его 25 лет, — и о женщине, которую он так и не решился полюбить. Аргентинский «Оскар», детектив и история любви в одном."},
{t:"Отступники",o:"The Departed",y:2006,k:"film",min:151,ev:1,g:["Триллер","Криминал"],m:["На краю дивана"],d:"Полицейский под прикрытием внедрён в банду, а человек банды — в полицию. Оба ищут «крота», то есть друг друга. Скорсезе, ДиКаприо, Деймон, Николсон — плотно и жёстко."},
{t:"Убийца",o:"Sicario",y:2015,k:"film",min:121,ev:1,g:["Триллер","Боевик","Криминал"],m:["На краю дивана","Мрачно"],d:"Агент ФБР попадает в спецгруппу, которая воюет с картелями на границе с Мексикой по своим правилам. Одна из самых напряжённых сцен на дороге в истории кино."},
{t:"Стрингер",o:"Nightcrawler",y:2014,k:"film",min:117,ev:1,g:["Триллер","Драма"],m:["Мрачно","Обсудить после"],d:"Ночной Лос-Анджелес, одержимый успехом одиночка снимает аварии и преступления для телевидения и всё дальше переходит черту. Джейк Джилленхол пугает по-настоящему."},
{t:"Анатомия падения",o:"Anatomie d'une chute",y:2023,k:"film",min:151,ev:1,g:["Детектив","Драма"],m:["Обсудить после"],d:"Мужчина погибает, упав из окна шале; под подозрением — жена. Судебная драма, где разбирают не только улики, но и сам брак. Идеальный повод для долгого разговора вдвоём."},
{t:"Конклав",o:"Conclave",y:2024,k:"film",min:120,ev:1,g:["Триллер","Драма"],m:["На краю дивана","Обсудить после"],d:"Кардиналы запираются в Ватикане, чтобы выбрать нового папу, и с каждым туром голосования вскрываются чужие тайны. Тихий, но очень цепкий политический триллер."},
{t:"Счастливое число Слевина",o:"Lucky Number Slevin",y:2006,k:"film",min:110,ev:1,g:["Криминал","Триллер","Комедия"],m:["На краю дивана","Легко и весело"],d:"Парня принимают за должника сразу двух враждующих боссов мафии. Остроумно, стильно и с хитро собранным сюжетом."},
{t:"Прочь",o:"Get Out",y:2017,k:"film",min:104,ev:1,g:["Ужасы","Триллер"],m:["На краю дивана","Обсудить после"],d:"Парень едет знакомиться с родителями девушки, и в идеальном доме всё кажется чуть-чуть не так. Умный жанровый фильм — страшно, но без лишней крови."},
{t:"Тихое место",o:"A Quiet Place",y:2018,k:"film",min:90,ev:1,g:["Ужасы","Фантастика"],m:["На краю дивана"],d:"Семья выживает в мире, где любой звук привлекает хищников. Полтора часа почти в тишине — затаите дыхание вместе."},
{t:"Текст",o:"Текст",y:2019,k:"film",min:132,ev:1,g:["Триллер","Драма"],m:["Мрачно","Обсудить после"],d:"Вышедший после несправедливого срока парень завладевает телефоном своего обидчика — и начинает жить его жизнью через переписку. Один из самых сильных российских фильмов последних лет."},
// ---------- ФАНТАСТИКА И ЭКШЕН ----------
{t:"Начало",o:"Inception",y:2010,k:"film",min:148,ev:1,g:["Фантастика","Боевик"],m:["На краю дивана","Обсудить после"],d:"Команда проникает в сны, чтобы внедрить человеку идею. Ограбление в нескольких слоях реальности — красиво, умно и с открытым финалом для споров."},
{t:"Престиж",o:"The Prestige",y:2006,k:"film",min:130,ev:1,g:["Драма","Мистика","Триллер"],m:["На краю дивана","Обсудить после"],d:"Два фокусника XIX века соперничают до одержимости. Нолан строит фильм как трюк — и разгадка того стоит."},
{t:"Грань будущего",o:"Edge of Tomorrow",y:2014,k:"film",min:113,ev:1,g:["Фантастика","Боевик"],m:["На краю дивана","Легко и весело"],d:"Офицер застревает в одном дне войны с инопланетянами и проживает его снова и снова, каждый раз чуть лучше. Динамично, с юмором и отличной Эмили Блант."},
{t:"Исходный код",o:"Source Code",y:2011,k:"film",min:93,ev:1,g:["Фантастика","Триллер"],m:["На краю дивана"],d:"Военный раз за разом проживает последние восемь минут перед взрывом поезда, чтобы найти бомбу. Короткий, умный и очень бодрый."},
{t:"Прибытие",o:"Arrival",y:2016,k:"film",min:116,ev:1,g:["Фантастика","Драма"],m:["Обсудить после","Вдохновляюще"],d:"Лингвиста зовут понять язык пришельцев, прилетевших на Землю. Тихая, умная фантастика, после которой хочется помолчать вместе."},
{t:"Марсианин",o:"The Martian",y:2015,k:"film",min:144,ev:1,g:["Фантастика","Приключения"],m:["Вдохновляюще","Легко и весело"],d:"Астронавта забывают на Марсе, и он решает выжить с помощью науки и чувства юмора. Оптимистичное кино — поднимает настроение."},
{t:"Гравитация",o:"Gravity",y:2013,k:"film",min:91,ev:1,g:["Фантастика","Триллер"],m:["На краю дивана"],d:"Два астронавта остаются в открытом космосе после аварии. Полтора часа чистого напряжения — лучше на большом экране и со звуком."},
{t:"Интерстеллар",o:"Interstellar",y:2014,k:"film",min:169,ev:1,g:["Фантастика","Драма"],m:["Вдохновляюще","Обсудить после"],d:"Земля умирает, и группа летит сквозь червоточину искать новый дом. Длинный, но в нём космос, время и любовь отца к дочери. Начинайте пораньше."},
{t:"Безумный Макс: Дорога ярости",o:"Mad Max: Fury Road",y:2015,k:"film",min:120,ev:1,g:["Боевик","Фантастика"],m:["На краю дивана"],d:"Двухчасовая погоня по пустыне без передышки. Если хочется адреналина — лучше не найти."},
{t:"Топ Ган: Мэверик",o:"Top Gun: Maverick",y:2022,k:"film",min:131,ev:1,g:["Боевик","Драма"],m:["Вдохновляюще","На краю дивана"],d:"Легендарный пилот готовит молодых асов к почти невыполнимой миссии. Настоящие полёты, драйв и тёплая ностальгия; первую часть смотреть не обязательно."},
{t:"Миссия невыполнима: Последствия",o:"Mission: Impossible – Fallout",y:2018,k:"film",min:147,ev:1,g:["Боевик","Шпионский"],m:["На краю дивана","Легко и весело"],d:"Итан Хант пытается исправить провал операции и не дать ядерным зарядам попасть не в те руки. Лучшая часть франшизы, трюки — без компьютерной графики."},
{t:"Джон Уик",o:"John Wick",y:2014,k:"film",min:101,ev:1,g:["Боевик","Криминал"],m:["На краю дивана"],d:"Отошедший от дел киллер возвращается, когда у него отнимают последнее, что ему дорого. Простой сюжет и очень красивые драки."},
{t:"Гнев человеческий",o:"Wrath of Man",y:2021,k:"film",min:119,ev:1,g:["Боевик","Криминал","Триллер"],m:["На краю дивана","Мрачно"],d:"Молчаливый новичок устраивается в инкассаторскую компанию — и явно пришёл туда не за зарплатой. Гай Ричи в серьёзном, холодном режиме."},
{t:"Бесславные ублюдки",o:"Inglourious Basterds",y:2009,k:"film",min:153,ev:1,g:["Боевик","Драма","Комедия"],m:["На краю дивана"],d:"Отряд мстителей и девушка-киномеханик независимо друг от друга готовят удар по верхушке Третьего рейха. Тарантино: длинные диалоги, от которых невозможно оторваться."},

{t:"Поймай меня, если сможешь",o:"Catch Me If You Can",y:2002,k:"film",min:141,ev:1,g:["Криминал","Биография","Комедия"],m:["Легко и весело","Вдохновляюще"],d:"Реальная история юного афериста, который выдавал себя за пилота, врача и юриста, и агента ФБР, гонявшегося за ним годами. Лёгкий, обаятельный Спилберг."},
{t:"Одиннадцать друзей Оушена",o:"Ocean's Eleven",y:2001,k:"film",min:116,ev:1,g:["Криминал","Комедия"],m:["Легко и весело"],d:"Обаятельная команда грабит три казино Лас-Вегаса за одну ночь. Стильно, весело и без лишней жестокости."},
{t:"Ограбление по-итальянски",o:"The Italian Job",y:2003,k:"film",min:111,ev:1,g:["Криминал","Боевик"],m:["Легко и весело","На краю дивана"],d:"Команда мстит предателю, укравшему их золото, с помощью трёх Mini Cooper и пробок Лос-Анджелеса. Динамичный и лёгкий фильм."},
{t:"Мистер и миссис Смит",o:"Mr. & Mrs. Smith",y:2005,k:"film",min:120,ev:1,g:["Боевик","Комедия","Мелодрама"],m:["Легко и весело","Романтично"],d:"Скучающие супруги узнают, что оба — наёмные убийцы и что их наняли друг против друга. Почти обязательный фильм для вечера вдвоём."},
// ---------- ДРАМЫ, БИОГРАФИИ, ВДОХНОВЛЯЮЩЕЕ ----------
{t:"Паразиты",o:"Gisaengchung",y:2019,k:"film",min:132,ev:1,g:["Триллер","Драма","Комедия"],m:["На краю дивана","Обсудить после"],d:"Бедная семья по одному устраивается работать к богатым — и всё идёт слишком хорошо. Начинается как комедия, заканчивается так, что не забудешь. «Оскар» за лучший фильм."},
{t:"Одержимость",o:"Whiplash",y:2014,k:"film",min:106,ev:1,g:["Драма"],m:["На краю дивана","Обсудить после"],d:"Молодой барабанщик попадает к жестокому преподавателю, который выжимает из учеников всё. Музыкальный фильм, который ощущается как триллер."},

(function(){
'use strict';
var K='kino_v1',S;
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
S.seen=S.seen||{};S.want=S.want||{};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var data=window.KINO.map(function(x,i){x.id=x.o+'|'+x.y;return x});
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var MOODS=['На краю дивана','Легко и весело','Романтично','Обсудить после','Вдохновляюще','Мрачно','Уютно'];
var MI={'На краю дивана':'😱','Легко и весело':'😄','Романтично':'❤️','Обсудить после':'💬','Вдохновляюще':'✨','Мрачно':'🌑','Уютно':'🛋️'};
var genres={};data.forEach(function(x){x.g.forEach(function(g){genres[g]=(genres[g]||0)+1})});
var GEN=Object.keys(genres).sort(function(a,b){return genres[b]-genres[a]});
var FORMATS=[['all','Всё'],['short','Фильм до 2 ч'],['film','Любой фильм'],['one','Сериал за 1 вечер'],['ep','Серия = вечер'],['multi','Сериал на 2–3 вечера']];
var LISTS=[['all','Все'],['want','Хотим посмотреть'],['seen','Смотрели']];

var F={mood:{},genre:{},format:'all',list:'all',q:''};

function chips(el,items,isMulti,key){
  $(el).innerHTML=items.map(function(it){
    var v=Array.isArray(it)?it[0]:it, l=Array.isArray(it)?it[1]:((MI[it]?MI[it]+' ':'')+it);
    var on=isMulti?!!F[key][v]:F[key]===v;
    return '<button class="chip'+(on?' on':'')+'" data-v="'+esc(v)+'">'+esc(l)+'</button>';
  }).join('');
  $(el).onclick=function(e){var b=e.target.closest('.chip');if(!b)return;var v=b.dataset.v;
    if(isMulti){if(F[key][v])delete F[key][v];else F[key][v]=1}else F[key]=v;
    renderChips();render();};
}
function renderChips(){
  chips('moods',MOODS,true,'mood');chips('genres',GEN,true,'genre');
  chips('formats',FORMATS,false,'format');chips('lists',LISTS,false,'list');
}
function dur(x){
  if(x.k==='film'){var h=Math.floor(x.min/60),m=x.min%60;return h+' ч'+(m?' '+m+' мин':'')}
  if(x.ev==='ep')return 'серия ≈ '+x.min+' мин';
  var hh=Math.round(x.min/30)/2;return 'сериал · ≈'+String(hh).replace('.',',')+' ч всего';
}
function evLabel(x){
  if(x.k==='film')return 'Фильм на вечер';
  if(x.ev==='ep')return 'Серия = вечер';
  if(x.ev===1)return 'Сериал за вечер';
  return 'На '+x.ev+(x.ev===2?' вечера':' вечера');
}
function match(x){
  var ms=Object.keys(F.mood),gs=Object.keys(F.genre);
  if(ms.length&&!ms.some(function(m){return x.m.indexOf(m)>=0}))return false;
  if(gs.length&&!gs.some(function(g){return x.g.indexOf(g)>=0}))return false;
  var f=F.format;
  if(f==='short'&&!(x.k==='film'&&x.min<=120))return false;
  if(f==='film'&&x.k!=='film')return false;
  if(f==='one'&&!(x.k==='series'&&x.ev===1))return false;
  if(f==='ep'&&x.ev!=='ep')return false;
  if(f==='multi'&&!(x.k==='series'&&(x.ev===2||x.ev===3)))return false;
  if(F.list==='want'&&!S.want[x.id])return false;
  if(F.list==='seen'&&!S.seen[x.id])return false;
  if($('hideSeen').checked&&F.list!=='seen'&&S.seen[x.id])return false;
  if(F.q){var s=(x.t+' '+x.o+' '+x.d+' '+x.g.join(' ')).toLowerCase();if(s.indexOf(F.q)<0)return false}
  return true;
}
var current=[];
function card(x,hl){
  var kp='https://www.kinopoisk.ru/index.php?kp_query='+encodeURIComponent(x.t+' '+x.y);
  return '<div class="card'+(S.seen[x.id]?' seen':'')+(hl?' hl':'')+'" id="c-'+esc(x.id)+'">'+
   '<h3>'+esc(x.t)+'</h3><div class="orig">'+(x.o!==x.t?esc(x.o)+' · ':'')+x.y+' · '+dur(x)+'</div>'+
   '<div class="meta"><span class="tag t">'+evLabel(x)+'</span>'+
   x.m.map(function(m){return '<span class="tag m">'+(MI[m]||'')+' '+esc(m)+'</span>'}).join('')+
   x.g.map(function(g){return '<span class="tag">'+esc(g)+'</span>'}).join('')+'</div>'+
   '<p>'+esc(x.d)+'</p>'+
   '<div class="acts"><button class="want'+(S.want[x.id]?' on':'')+'" data-a="want" data-id="'+esc(x.id)+'">'+(S.want[x.id]?'★ Хотим':'☆ Хотим')+'</button>'+
   '<button class="'+(S.seen[x.id]?'on':'')+'" data-a="seen" data-id="'+esc(x.id)+'">'+(S.seen[x.id]?'✓ Смотрели':'Смотрели')+'</button>'+
   '<a href="'+kp+'" target="_blank" rel="noopener">Найти на Кинопоиске ↗</a></div></div>';
}
function render(hlId){
  current=data.filter(match);
  if(hlId){current.sort(function(a,b){return (b.id===hlId)-(a.id===hlId)})}
  $('count').textContent='Найдено: '+current.length+' из '+data.length;
  $('list').innerHTML=current.length?current.map(function(x){return card(x,x.id===hlId)}).join(''):
    '<div class="empty">Ничего не подошло 🤷‍♂️<br>Снимите часть фильтров.</div>';
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;
  var id=b.dataset.id,a=b.dataset.a;
  if(S[a][id])delete S[a][id];else S[a][id]=Date.now();
  if(a==='seen'&&S.seen[id])delete S.want[id];
  save();render();
});
$('q').addEventListener('input',function(){F.q=this.value.trim().toLowerCase();render()});
$('hideSeen').checked=S.hideSeen!==false;
$('hideSeen').addEventListener('change',function(){S.hideSeen=this.checked;save();render()});
$('reset').onclick=function(){F={mood:{},genre:{},format:'all',list:'all',q:''};$('q').value='';renderChips();render();window.scrollTo(0,0)};
$('random').onclick=function(){
  var pool=current.filter(function(x){return !S.seen[x.id]});
  if(!pool.length)pool=current;
  if(!pool.length)return;
  var x=pool[Math.floor(Math.random()*pool.length)];
  render(x.id);
  var el=document.getElementById('c-'+x.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
};
renderChips();render();
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
