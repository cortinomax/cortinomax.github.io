<style>

<script>
(function(){
const MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MN=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
/* Производственный календарь 2027 (постановление Правительства РФ № 1187 от 17.09.2026).
   REDDAYS — праздники и нерабочие дни, выделяются красным. HOL — праздники по ст. 112 ТК, не входят в отпуск. */
const REDDAYS=new Set(['01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08','01-09','01-10','02-22','02-23','03-08','05-01','05-03','05-09','05-10','06-12','06-14','11-04','11-05','12-31'].map(d=>'2027-'+d));
const RED_LIST=[['1–10 января','Новогодние каникулы и Рождество'],['22–23 февраля','День защитника Отечества'],['8 марта','Международный женский день'],['1 и 3 мая','Праздник Весны и Труда'],['9 и 10 мая','День Победы'],['12 и 14 июня','День России'],['4–5 ноября','День народного единства'],['31 декабря','Выходной (перенос с 3 января)']];
const WORK_LIST=[['20 февраля','Рабочая суббота (выходной перенесён на 22 февраля)']];
const isRed=iso=>REDDAYS.has(iso);
const HOL=['01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08','02-23','03-08','05-01','05-09','06-12','11-04'];
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const toD=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fromT=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const isHol=t=>{const d=new Date(t);return HOL.includes(pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()))};
const countDays=(s,e)=>{let n=0;for(let t=toD(s);t<=toD(e);t+=DAY) if(!isHol(t)) n++;return n};
const calLen=(s,e)=>(toD(e)-toD(s))/DAY+1;
const inter=(a,b)=>{const s=Math.max(toD(a.s),toD(b.s)),e=Math.min(toD(a.e),toD(b.e));return s<=e?{s:fromT(s),e:fromT(e)}:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const dayWord=n=>{const a=n%10,b=n%100;return (a===1&&b!==11)?'день':(a>=2&&a<=4&&(b<12||b>14))?'дня':'дней'};
function fmtR(s,e){const a=new Date(toD(s)),b=new Date(toD(e));
  if(s===e) return a.getUTCDate()+' '+MS[a.getUTCMonth()];
  if(a.getUTCMonth()===b.getUTCMonth()) return a.getUTCDate()+'–'+b.getUTCDate()+' '+MS[b.getUTCMonth()];
  return a.getUTCDate()+' '+MS[a.getUTCMonth()]+' – '+b.getUTCDate()+' '+MS[b.getUTCMonth()];}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- команда (фамилии сокращены до 3 букв; в базе хранятся только коды и даты) ---------- */
const TEAM={
  year:2027,
  directions:['Руководитель штаба','Целеполагание и БП','Ресурсное управление','Закупки и снабжение'],
  employees:[
    {id:'rk1',name:'Его. М.',dir:'Руководитель штаба',days:28},
    {id:'bp1',name:'Кор. О.',dir:'Целеполагание и БП',days:28},
    {id:'bp2',name:'Бул. О.',dir:'Целеполагание и БП',days:28},
    {id:'bp3',name:'Енг. О.',dir:'Целеполагание и БП',days:28},
    {id:'ru1',name:'Коб. О.',dir:'Ресурсное управление',days:28},
    {id:'ru2',name:'Нов. Т.',dir:'Ресурсное управление',days:28},
    {id:'zs1',name:'Сит. И.',dir:'Закупки и снабжение',days:28},
    {id:'zs2',name:'Дег. Е.',dir:'Закупки и снабжение',days:28}
  ]
};

/* ---------- подключение ---------- */
const hp=new URLSearchParams(location.hash.slice(1));
const FC=window.FIREBASE_CONFIG||{};
let CFG={apiKey:(hp.get('a')||FC.apiKey||ls.get('otp.a')||'').trim(),projectId:(hp.get('p')||FC.projectId||ls.get('otp.p')||'').trim()};
let KEY=(hp.get('k')||ls.get('otp.k')||'').trim().toLowerCase();
if(hp.get('a'))ls.set('otp.a',CFG.apiKey);
if(hp.get('p'))ls.set('otp.p',CFG.projectId);
if(hp.get('k'))ls.set('otp.k',KEY);
const builtIn=!!(FC.apiKey&&FC.projectId);

if(hp.get('k')&&builtIn){try{history.replaceState(null,'',location.pathname)}catch(e){}}
function shareLink(){
  if(builtIn)return location.origin+location.pathname;
  const p=new URLSearchParams();p.set('p',CFG.projectId);p.set('a',CFG.apiKey);
  return location.origin+location.pathname+'#'+p.toString();
}
let fdb=null,col=null,unsub=null,loadTimer=null;
function connect(){
  if(!window.firebase||!firebase.firestore) throw new Error('sdk');
  const name='otp-'+CFG.projectId+'-'+CFG.apiKey.slice(-6);

const empById=id=>emps().find(e=>e.id===id);
const dirIdx=name=>{const i=dirs().indexOf(name);return i<0?0:(i%6)+1};
const dirName=name=>name||'Без направления';
const ent=e=>Number(e&&e.days)||28;

function analyze(periods){
  const y=String(year());
  const rows=(periods||[]).map(p=>({s:p.s||'',e:p.e||''}));
  rows.forEach(p=>{
    if(!p.s||!p.e){p.err='Укажите обе даты';return}
    if(p.e<p.s){p.err='Дата окончания раньше начала';return}
    if(!p.s.startsWith(y+'-')||!p.e.startsWith(y+'-')){p.err='Обе даты должны быть в '+y+' году';return}
    p.days=countDays(p.s,p.e);
    if(!p.days) p.err='В периоде только праздничные дни';
  });
  rows.forEach((p,i)=>{if(p.err)return;rows.forEach((q,j)=>{if(i!==j&&!q.err&&inter(p,q))p.err='Пересекается с другим вашим периодом'})});
  const ok=rows.filter(p=>!p.err);
  return {rows,ok,total:ok.reduce((a,p)=>a+p.days,0),has14:ok.some(p=>p.days>=14)};
}
function okPeriods(empId){return analyze(S.data.plans[empId]).ok}
function status(e,periods){
  const a=analyze(periods!==undefined?periods:S.data.plans[e.id]);const E=ent(e);
  if(!a.ok.length) return {k:'none',t:'Не заполнено',a};
  if(a.total>E) return {k:'bad',t:'Превышение на '+(a.total-E)+' дн.',a};
  if(!a.has14) return {k:'bad',t:'Нет части от 14 дней',a};
  if(a.total<E) return {k:'warn',t:'Осталось '+(E-a.total)+' дн.',a};
  return {k:'ok',t:'Готово',a};
}

/* ---------- шкала года ---------- */
function timeline(rows,opts){
  opts=opts||{};const y=year(),y0=Date.UTC(y,0,1),N=(Date.UTC(y+1,0,1)-y0)/DAY;
  const pos=(s,e)=>{const a=(toD(s)-y0)/DAY,b=(toD(e)-y0)/DAY+1;return 'left:'+(a/N*100)+'%;width:'+((b-a)/N*100)+'%'};
  let head='',lines='',hol='';
  for(let m=0;m<12;m++){const d=(Date.UTC(y,m+1,1)-Date.UTC(y,m,1))/DAY;head+='<span style="width:'+(d/N*100)+'%">'+MN[m]+'</span>';
    if(m) lines+='<b class="ml" style="left:'+((Date.UTC(y,m,1)-y0)/DAY/N*100)+'%"></b>';}
  REDDAYS.forEach(d=>{if(d.startsWith(y+'-'))hol+='<b class="hol" style="'+pos(d,d)+'"></b>'});
  let h='<div class="tlbox"><div class="tl"><div class="tl-row tl-head"><div class="tl-lab muted small">'+esc(opts.corner||'Сотрудник')+'</div><div class="tl-track">'+head+'</div></div>';
  rows.forEach(r=>{
    h+='<div class="tl-row'+(r.me?' me':'')+'"><div class="tl-lab" title="'+esc(r.label)+'"><span class="dot" style="background:var(--d'+r.c+')"></span><span class="n">'+esc(r.label)+'</span></div><div class="tl-track">'+lines+hol;
    r.periods.forEach(p=>{h+='<i class="bar" style="'+pos(p.s,p.e)+';background:var(--d'+r.c+')" title="'+esc(fmtR(p.s,p.e))+'"></i>'});
    (r.clash||[]).forEach(p=>{h+='<i class="clash" style="'+pos(p.s,p.e)+'" title="Пересечение: '+esc(fmtR(p.s,p.e))+'"></i>'});
    h+='</div></div>';
  });
  if(opts.coverage){
    const cnt=new Array(N).fill(0);
    rows.forEach(r=>{const seen=new Set();r.periods.forEach(p=>{for(let t=toD(p.s);t<=toD(p.e);t+=DAY){const i=(t-y0)/DAY;if(!seen.has(i)){seen.add(i);cnt[i]++}}})});
    const size=rows.length;let cells='';
    for(let w=0;w*7<N;w++){const a=w*7,b=Math.min(N,a+7);let mx=0;for(let i=a;i<b;i++)mx=Math.max(mx,cnt[i]);
      const share=size?mx/size:0;const hot=mx>=2&&share>=0.5;
      const bg=mx?(hot?'color-mix(in srgb,var(--clash) '+Math.round(30+share*50)+'%,transparent)':'color-mix(in srgb,var(--accent) '+Math.round(15+share*45)+'%,transparent)'):'transparent';
      cells+='<i style="width:'+((b-a)/N*100)+'%;background:'+bg+'" title="Неделя с '+esc(fmtR(fromT(y0+a*DAY),fromT(y0+a*DAY)))+': одновременно в отпуске до '+mx+' из '+size+'">'+(mx||'')+'</i>';}
    h+='<div class="tl-row cov"><div class="tl-lab">Одновременно в отпуске</div><div class="tl-track">'+cells+'</div></div>';
  }
  return h+'</div></div>';
}
function pairOverlaps(list){
  const out=[];
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const A=list[i],B=list[j];
    A.periods.forEach(p=>B.periods.forEach(q=>{const x=inter(p,q);if(x)out.push({a:A.emp,b:B.emp,s:x.s,e:x.e})}));
  }
  return out.sort((x,y)=>x.s<y.s?-1:1);
}

function redIn(s,e){const r=[];for(let t=toD(s);t<=toD(e);t+=DAY){const d=fromT(t);if(isRed(d))r.push(d)}return r}
function fmtDays(list){
  const out=[];let i=0;
  while(i<list.length){let j=i;while(j+1<list.length&&toD(list[j+1])-toD(list[j])===DAY)j++;out.push(fmtR(list[i],list[j]));i=j+1}
  return out.join(', ');
}

function openPicker(focusIdx){
  const list=analyze(S.draft).ok.map(p=>({s:p.s,e:p.e})).sort((x,y)=>x.s<y.s?-1:1);
  let m=0;
  const f=focusIdx!=null&&S.draft[focusIdx]&&S.draft[focusIdx].s?S.draft[focusIdx]:list[0];
  if(f)m=Number(f.s.slice(5,7))-1;
  PK={m,list,a:'',sel:-1,msg:''};

  renderPicker();

function closePicker(apply){
  if(!PK)return;
  if(apply){S.draft=PK.list.slice().sort((x,y)=>x.s<y.s?-1:1);S.dirty=true;S.msg=''}
  PK=null;document.body.style.overflow='';document.getElementById('pkroot').innerHTML='';render();
}
function busyMap(){

}
function pkIndexAt(iso){return PK.list.findIndex(p=>iso>=p.s&&iso<=p.e)}

  return h;
}

  h+='<section class="card"><h2>Пересечения</h2>';

    h+='<div class="eyebrow">Внутри направления · '+same.length+'</div>'+(same.length?'<ul class="olist">'+same.map(li).join('')+'</ul>':'<div class="small muted">Нет</div>');

  }
  h+='</section>';

  const done=scope.filter(e=>status(e).k==='ok').length;
  h+='<section class="card"><div class="row" style="justify-content:space-between"><h2>Кто сколько заполнил</h2><span class="chip">Готово <b>'+done+'</b> из '+scope.length+'</span></div><div class="tblbox"><table class="st"><thead><tr><th>ФИО</th><th>Направление</th><th>Дней</th><th>Части</th><th>Статус</th></tr></thead><tbody>'+
    scope.map(e=>{const s=status(e);return '<tr><td>'+esc(e.name)+'</td><td><span class="dot" style="background:var(--d'+dirIdx(e.dir)+')"></span> '+esc(dirName(e.dir))+'</td><td>'+s.a.total+'&nbsp;/&nbsp;'+ent(e)+'</td><td class="small">'+(s.a.ok.map(p=>fmtR(p.s,p.e)+' ('+p.days+')').join(', ')||'—')+'</td><td><span class="chip '+(s.k==='ok'?'ok':s.k==='bad'?'bad':s.k==='warn'?'warn':'')+'">'+s.t+'</span></td></tr>'}).join('')+
    '</tbody></table></div></section>';

function applyPlans(p){
  S.data.plans=p;
  if(S.me&&!empById(S.me)){S.me='';ls.set('otp.me','')}
  if(!S.dirty)S.draft=clone(S.data.plans[S.me]||[]);
  S.state='ready';
}
function errText(e){
  const c=e&&e.code;
  if(c==='permission-denied')return 'База не принимает изменения. Попросите у руководителя актуальную ссылку.';
  if(c==='unavailable')return 'Нет связи с базой. Проверьте интернет и попробуйте ещё раз.';
  return 'Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.';
}
function subscribe(onFirst){
  if(unsub)unsub();
  clearTimeout(loadTimer);
  let first=true;
  loadTimer=setTimeout(()=>{
    if(S.state==='ready'){S.stale=true}
    else{S.state='error';S.fatal='Нет связи с общей базой. Если вы в рабочей сети банка, откройте ссылку с телефона через мобильный интернет.'}
    render();
  },12000);
  unsub=col.onSnapshot({includeMetadataChanges:true},snap=>{
    const p={};snap.docs.forEach(d=>{const v=d.data();p[d.id]=(v.periods||[]).map(x=>({s:x.s,e:x.e}))});
    if(!snap.metadata.fromCache){clearTimeout(loadTimer);S.stale=false}
    applyPlans(p);
    if(first){first=false;if(onFirst)onFirst(null)}
    render();
  },err=>{
    clearTimeout(loadTimer);
    if(first&&onFirst){first=false;onFirst(err);return}
    if(err&&err.code==='permission-denied'){S.state='error';S.fatal='Ссылка устарела или ключ неверный. Попросите у руководителя актуальную ссылку.'}
    else if(S.state==='ready'){S.stale=true}
    else{S.state='error';S.fatal='Нет связи с общей базой. Если вы в рабочей сети банка, откройте ссылку с телефона через мобильный интернет.'}
    render();
  });
}


/* ---------- выгрузка в Excel (.xlsx собирается прямо в браузере) ---------- */
const XL={
  crcT:(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),
  crc(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=XL.crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0},
  zip(files){
    const enc=new TextEncoder(),parts=[],cd=[];let off=0;
    const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
    files.forEach(f=>{
      const name=enc.encode(f.name),data=enc.encode(f.data),crc=XL.crc(data);
      const head=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
      parts.push(new Uint8Array(head),name,data);
      cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
      off+=head.length+name.length+data.length;
    });
    const cdSize=cd.reduce((a,x)=>a+x.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
    return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  },
  x(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))},
  col(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
};
function makeStyles(){
  const fills=['none','gray125'],fonts=['<font><sz val="10"/><name val="Arial"/></font>'],xfs=['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'],map={};
  return {
    get(o){o=o||{};const key=JSON.stringify(o);if(map[key]!=null)return map[key];
      let fi=0;if(o.fill){const f='<fill><patternFill patternType="solid"><fgColor rgb="FF'+o.fill+'"/><bgColor indexed="64"/></patternFill></fill>';fi=fills.indexOf(f);if(fi<0){fills.push(f);fi=fills.length-1}}
      let fo=0;if(o.bold||o.color||o.size){const f='<font>'+(o.bold?'<b/>':'')+'<sz val="'+(o.size||10)+'"/>'+(o.color?'<color rgb="FF'+o.color+'"/>':'')+'<name val="Arial"/></font>';fo=fonts.indexOf(f);if(fo<0){fonts.push(f);fo=fonts.length-1}}
      const al=o.align||o.wrap||o.valign?'<alignment'+(o.align?' horizontal="'+o.align+'"':'')+(o.valign?' vertical="'+o.valign+'"':' vertical="center"')+(o.wrap?' wrapText="1"':'')+'/>':'';
      xfs.push('<xf numFmtId="0" fontId="'+fo+'" fillId="'+fi+'" borderId="'+(o.border?1:0)+'" xfId="0"'+(fi?' applyFill="1"':'')+(fo?' applyFont="1"':'')+(o.border?' applyBorder="1"':'')+(al?' applyAlignment="1">'+al+'</xf>':'/>'));
      return map[key]=xfs.length-1},
    xml(){
      const f=x=>x==='none'||x==='gray125'?'<fill><patternFill patternType="'+x+'"/></fill>':x;
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
        '<fonts count="'+fonts.length+'">'+fonts.join('')+'</fonts><fills count="'+fills.length+'">'+fills.map(f).join('')+'</fills>'+
        '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFD9E1EA"/></left><right style="thin"><color rgb="FFD9E1EA"/></right><top style="thin"><color rgb="FFD9E1EA"/></top><bottom style="thin"><color rgb="FFD9E1EA"/></bottom><diagonal/></border></borders>'+
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="'+xfs.length+'">'+xfs.join('')+'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'}
  };
}
function makeSheet(name){
  const rows={},merges=[],cols=[];let freeze=null,heights={};
  return {name,
    set(r,c,v,st){(rows[r]=rows[r]||{})[c]={v,st}},
    merge(r1,c1,r2,c2){merges.push(XL.col(c1)+(r1+1)+':'+XL.col(c2)+(r2+1))},
    width(c,w,c2){cols.push('<col min="'+(c+1)+'" max="'+((c2==null?c:c2)+1)+'" width="'+w+'" customWidth="1"/>')},
    height(r,h){heights[r]=h},
    freeze(r,c){freeze={r,c}},
    xml(){
      let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
      x+='<sheetViews><sheetView workbookViewId="0" zoomScale="90">'+(freeze?'<pane'+(freeze.c?' xSplit="'+freeze.c+'"':'')+(freeze.r?' ySplit="'+freeze.r+'"':'')+' topLeftCell="'+XL.col(freeze.c)+(freeze.r+1)+'" activePane="bottomRight" state="frozen"/>':'')+'</sheetView></sheetViews>';
      x+='<sheetFormatPr defaultRowHeight="15"/>';
      if(cols.length)x+='<cols>'+cols.join('')+'</cols>';
      x+='<sheetData>';
      Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(r=>{
        x+='<row r="'+(r+1)+'"'+(heights[r]?' ht="'+heights[r]+'" customHeight="1"':'')+'>';
        Object.keys(rows[r]).map(Number).sort((a,b)=>a-b).forEach(c=>{
          const {v,st}=rows[r][c],ref=XL.col(c)+(r+1),sa=st?' s="'+st+'"':'';
          if(v===null||v===undefined||v==='')x+='<c r="'+ref+'"'+sa+'/>';
          else if(typeof v==='number')x+='<c r="'+ref+'"'+sa+'><v>'+v+'</v></c>';
          else x+='<c r="'+ref+'"'+sa+' t="inlineStr"><is><t xml:space="preserve">'+XL.x(v)+'</t></is></c>';
        });
        x+='</row>';
      });
      x+='</sheetData>';
      if(merges.length)x+='<mergeCells count="'+merges.length+'">'+merges.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>';
      return x+'</worksheet>';
    }};
}
function buildWorkbook(sheets,styles){
  const files=[
    {name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'},
    {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>'<sheet name="'+XL.x(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',data:styles.xml()}
  ];
  sheets.forEach((s,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:s.xml()}));
  return XL.zip(files);
}

function buildReport(dirFilter){
  const y=year(),st=makeStyles();

  const people=emps().filter(inScope);
  const per={};people.forEach(e=>per[e.id]=okPeriods(e.id));
  const y0=Date.UTC(y,0,1),N=(Date.UTC(y+1,0,1)-y0)/DAY;
  const dayIso=i=>fromT(y0+i*DAY);
  const onDay={};people.forEach(e=>{per[e.id].forEach(p=>{for(let t=toD(p.s);t<=toD(p.e);t+=DAY){const k=(t-y0)/DAY;(onDay[k]=onDay[k]||[]).push(e)}})});
  const title='Отпуска '+y+(dirFilter!=null?' — '+dirName(dirFilter):'');

  /* --- Лист 1: календарь --- */
  const S1=makeSheet('Календарь');const F=3,HR=7;

  S1.set(1,0,'Выгрузка от '+new Date().toLocaleString('ru-RU'),st.get({color:'5A6879'}));

  // шапка: месяцы, числа, дни недели
  for(let m=0;m<12;m++){const a=(Date.UTC(y,m,1)-y0)/DAY,b=(Date.UTC(y,m+1,1)-y0)/DAY-1;
    S1.set(HR,F+a,MFULL[m],st.get({bold:true,fill:XC.head,align:'center',border:true}));for(let k=a+1;k<=b;k++)S1.set(HR,F+k,'',st.get({fill:XC.head,border:true}));S1.merge(HR,F+a,HR,F+b)}
  ['ФИО','Направление','Дней'].forEach((h,i)=>{S1.set(HR,i,'',st.get({fill:XC.head,border:true}));S1.set(HR+1,i,h,st.get({bold:true,fill:XC.head,border:true,align:i==2?'center':undefined}));S1.set(HR+2,i,'',st.get({fill:XC.head,border:true}))});

    const fill=red?XC.hol:we?XC.we:'FFFFFF';
    S1.set(HR+1,F+k,Number(iso.slice(8)),st.get({bold:true,fill,align:'center',border:true,size:9,color:red?'C0392B':undefined}));
    S1.set(HR+2,F+k,WD[wd],st.get({fill,align:'center',border:true,size:8,color:red?'C0392B':'5A6879'}));}
  let r=HR+3;
  groups.forEach(g=>{
    const list=people.filter(e=>(e.dir||'')===g.id);if(!list.length)return;
    S1.set(r,0,g.name,st.get({bold:true,fill:XC.grp,border:true}));S1.set(r,1,'',st.get({fill:XC.grp,border:true}));S1.set(r,2,'',st.get({fill:XC.grp,border:true}));
    for(let k=0;k<N;k++)S1.set(r,F+k,'',st.get({fill:XC.grp}));
    S1.merge(r,0,r,2);r++;
    list.forEach(e=>{
      const a=analyze(S.data.plans[e.id]);
      S1.set(r,0,e.name,st.get({border:true}));S1.set(r,1,dirName(e.dir),st.get({border:true,color:'5A6879'}));S1.set(r,2,a.total+'/'+ent(e),st.get({border:true,align:'center'}));
      const mine=new Set();per[e.id].forEach(p=>{for(let t=toD(p.s);t<=toD(p.e);t+=DAY)mine.add((t-y0)/DAY)});
      for(let k=0;k<N;k++){const iso=dayIso(k),wd=new Date(y0+k*DAY).getUTCDay();
        if(mine.has(k)){const others=(onDay[k]||[]).filter(o=>o!==e);
          const same=others.some(o=>(o.dir||'')===(e.dir||'')),cross=others.length>0;
          S1.set(r,F+k,same?'×':'',st.get({fill:same?XC.red:cross?XC.orange:XCOL[g.c],color:'FFFFFF',bold:true,align:'center',border:true,size:8}));
        }else S1.set(r,F+k,'',st.get({fill:isRed(iso)?XC.holCell:(wd===0||wd===6)?XC.we:undefined,border:true}));
      }
      r++;
    });
    S1.set(r,0,'Одновременно в отпуске',st.get({color:'5A6879',border:true}));S1.set(r,1,'',st.get({border:true}));S1.set(r,2,'',st.get({border:true}));
    for(let k=0;k<N;k++){const n=(onDay[k]||[]).filter(o=>(o.dir||'')===g.id).length;
      const hot=n>=2&&n/list.length>=0.5;
      S1.set(r,F+k,n||'',st.get({fill:n?(hot?XC.red:XCOL[g.c]):undefined,color:hot?'FFFFFF':undefined,bold:hot,align:'center',border:true,size:8}))}
    r+=2;
  });
  if(dirFilter==null&&groups.length>1){
    S1.set(r,0,'Всего в отпуске в день',st.get({bold:true,border:true}));S1.set(r,1,'',st.get({border:true}));S1.set(r,2,'',st.get({border:true}));
    for(let k=0;k<N;k++){const n=(onDay[k]||[]).length;S1.set(r,F+k,n||'',st.get({fill:n>=3?XC.orange:undefined,align:'center',border:true,size:8,bold:n>=3}))}
  }
  S1.freeze(HR+3,F);

  /* --- Лист 2: пересечения --- */
  const S2=makeSheet('Пересечения');
  const ov=pairOverlaps(people.map(e=>({emp:e,periods:per[e.id]})));
  S2.width(0,5);S2.width(1,18);S2.width(2,18);S2.width(3,24);S2.width(4,24);S2.width(5,26);S2.width(6,12);S2.width(7,12);S2.width(8,8);S2.width(9,22);
  S2.set(0,0,'Пересечения отпусков — '+title,st.get({bold:true,size:14}));S2.height(0,22);
  S2.set(1,0,'Внутри направления: '+ov.filter(o=>o.a.dir===o.b.dir).length+'   ·   Между направлениями: '+ov.filter(o=>o.a.dir!==o.b.dir).length,st.get({color:'5A6879'}));
  const H2=['№','Сотрудник 1','Сотрудник 2','Направление 1','Направление 2','Тип','С','По','Дней','Праздники в пересечении'];
  H2.forEach((h,i)=>S2.set(3,i,h,st.get({bold:true,fill:XC.head,border:true,wrap:true})));
  const sorted=ov.slice().sort((x,z)=>((x.a.dir===x.b.dir)?0:1)-((z.a.dir===z.b.dir)?0:1)||(x.s<z.s?-1:1));
  if(!sorted.length)S2.set(4,0,'Пересечений нет',st.get({color:'2A8A52',bold:true}));
  sorted.forEach((o,i)=>{const same=o.a.dir===o.b.dir,base={border:true,fill:same?'FBDAD4':'FDE9D6'};
    const reds=redIn(o.s,o.e);
    [i+1,o.a.name,o.b.name,dirName(o.a.dir),dirName(o.b.dir),same?'Внутри направления':'Между направлениями',dmy(o.s),dmy(o.e),calLen(o.s,o.e),reds.length?fmtDays(reds):''].forEach((v,c)=>S2.set(4+i,c,v,st.get(Object.assign({},base,c===5?{bold:true,color:same?'B03A2E':'9A5B12'}:{},c===0||c===8?{align:'center'}:{}))));
  });
  S2.freeze(4,0);

  /* --- Лист 3: сводка --- */
  const S3=makeSheet('Сводка');
  S3.width(0,18);S3.width(1,24);S3.width(2,11);S3.width(3,15);S3.width(4,11);S3.width(5,13);S3.width(6,44);S3.width(7,26);S3.width(8,22);
  S3.set(0,0,'Сводка по отпускам — '+title,st.get({bold:true,size:14}));S3.height(0,22);
  const done=people.filter(e=>status(e).k==='ok').length;
  S3.set(1,0,'Заполнили полностью: '+done+' из '+people.length,st.get({color:'5A6879'}));
  const H3=['ФИО','Направление','Положено','Запланировано','Осталось','Часть ≥ 14 дн.','Периоды (дней в отпуск)','Праздники в периодах','Статус'];
  H3.forEach((h,i)=>S3.set(3,i,h,st.get({bold:true,fill:XC.head,border:true,wrap:true})));
  people.forEach((e,i)=>{const sx=status(e),a=sx.a;
    const reds=[];a.ok.forEach(p=>reds.push(...redIn(p.s,p.e)));
    const sf=sx.k==='ok'?XC.ok:sx.k==='bad'?XC.bad:sx.k==='warn'?XC.warn:undefined;
    [e.name,dirName(e.dir),ent(e),a.total,ent(e)-a.total,a.has14?'да':'нет',a.ok.map(p=>dmy(p.s)+'–'+dmy(p.e)+' ('+p.days+')').join('; ')||'—',reds.length?fmtDays(reds):'',sx.t]
      .forEach((v,c)=>S3.set(4+i,c,v,st.get({border:true,wrap:c===6||c===7,align:(c>=2&&c<=5)?'center':undefined,fill:c===8?sf:(c===5&&!a.has14&&a.ok.length?XC.bad:undefined),bold:c===8})));
  });
  S3.freeze(4,1);

  return buildWorkbook([S1,S2,S3],st);
}
async function exportExcel(dirFilter){
  try{
    const blob=buildReport(dirFilter);
    const fname='Otpuska_'+year()+(dirFilter!=null?'_napr'+(dirs().indexOf(dirFilter)+1):'')+'.xlsx';
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Файл Excel сформирован');
  }catch(e){console.error(e);toast('Не удалось сформировать файл')}
}

/* ---------- действия ---------- */
let toastT;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600)}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast('Ссылка скопирована');return true}catch(e){return false}
}
function setMe(id){S.me=id;ls.set('otp.me',id);S.draft=clone(S.data.plans[id]||[]);S.dirty=false;S.msg='';S.adding=false}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-tab],[data-act],[data-f]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;ls.set('otp.tab',S.tab);render();window.scrollTo(0,0);return}
  if(t.dataset.f!==undefined){S.filter=t.dataset.f;render();return}
  const a=t.dataset.act,i=Number(t.dataset.i);
  if(a==='share'){
    const link=shareLink();
    if(navigator.share){try{await navigator.share({title:'Отпуска '+year(),text:'Внесите, пожалуйста, свои отпуска на '+year()+' год. Ключ доступа пришлю отдельно.',url:link});return}catch(e){if(e&&e.name==='AbortError')return}}
    if(!(await copy(link))){window.prompt('Скопируйте ссылку',link)}
    return}
  if(a==='retry'){location.reload();return}
  if(a==='connect'){
    const txt=document.getElementById('scfg').value;
    const ak=(txt.match(/apiKey["']?\s*:\s*["']([^"']+)["']/)||[])[1];
    const pid=(txt.match(/projectId["']?\s*:\s*["']([^"']+)["']/)||[])[1];
    const key=document.getElementById('skey').value.trim();
    if(!ak||!pid){S.msg='Не нашёл apiKey и projectId. Вставьте блок firebaseConfig целиком.';S.msgKind='err';render();return}
    if(!/^[A-Za-z0-9_-]{6,}$/.test(key)){S.msg='Ключ команды: латиница и цифры, от 6 символов';S.msgKind='err';render();return}
    CFG={apiKey:ak,projectId:pid};KEY=key;
    S.msg='Проверяем…';S.msgKind='';render();
    try{connect()}catch(e){S.msg='Не загрузилась библиотека Firebase. Проверьте интернет.';S.msgKind='err';render();return}
    subscribe(err=>{
      if(err){S.state='setup';S.msg=err.code==='permission-denied'?'База отклонила доступ: проверьте, что правила опубликованы и ключ совпадает с правилами.':'Не удалось подключиться: '+(err.message||err.code);S.msgKind='err';render();return}
      ls.set('otp.a',ak);ls.set('otp.p',pid);ls.set('otp.k',key);
      history.replaceState(null,'',shareLink());S.msg='';toast('Подключено. Ссылку для коллег — кнопкой вверху');
    });
    return}
  if(a==='add-period'){openPicker(null);return}
  if(a==='pick'){openPicker(i);return}
  if(a==='logout'){ls.set('otp.k','');location.replace(location.pathname);return}
  if(a==='xls'){exportExcel(S.tab==='team'&&S.filter!=='all'?S.filter:null);return}
  if(a==='del-period'){S.draft.splice(i,1);S.dirty=true;S.msg='';render();return}
  if(a==='reset-plan'){setMe(S.me);render();return}
  if(a==='save-plan'){await savePlan();return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='me'){setMe(t.value);render();return}
});
async function savePlan(){
  if(!S.me||S.saving)return;
  const a=analyze(S.draft);
  if(a.rows.some(p=>p.err)){S.msg='Исправьте периоды, отмеченные красным';S.msgKind='err';render();return}
  if(!a.has14){S.msg='Нельзя сохранить: одна из частей отпуска должна быть не менее 14 дней. Измените даты.';S.msgKind='err';render();return}
  const periods=a.ok.map(p=>({s:p.s,e:p.e,days:p.days})).sort((x,y)=>x.s<y.s?-1:1);
  S.saving=true;render();
  try{
    await Promise.race([
      col.doc(S.me).set({periods:periods.map(p=>({s:p.s,e:p.e})),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}),
      new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable'}),15000))
    ]);
    S.dirty=false;S.draft=clone(periods.map(p=>({s:p.s,e:p.e})));
    const st=status(empById(S.me),S.draft);S.msg=st.k==='ok'?'Сохранено. График полностью готов':'Сохранено. '+st.t;S.msgKind=st.k==='ok'?'good':'';
  }catch(e){S.msg=errText(e);S.msgKind='err'}
  S.saving=false;render();
}

/* ---------- вход по ключу ---------- */
function tryKey(k,fromStore){
  KEY=k;S.state='loading';S.loginMsg='';render();
  try{connect()}catch(e){S.state='error';S.fatal='Не загрузилась библиотека Firebase. Проверьте интернет или откройте ссылку с телефона.';render();return}
  subscribe(err=>{
    if(err){
      KEY='';ls.set('otp.k','');if(unsub){unsub();unsub=null}
      S.state='login';
      S.loginMsg=err.code==='permission-denied'?(fromStore?'Ключ изменился. Введите новый ключ от руководителя.':'Неверный ключ. Проверьте и введите ещё раз.'):'Нет связи с базой. Проверьте интернет.';
      render();const el=document.getElementById('lkey');if(el)el.focus();return}
    ls.set('otp.k',KEY);
  });
}
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='loginf')return;ev.preventDefault();
  const v=document.getElementById('lkey').value.replace(/\s+/g,'').toLowerCase();
  if(!v){S.loginMsg='Введите ключ';render();return}
  tryKey(v,false);
});

/* ---------- запуск ---------- */
if(!CFG.apiKey||!CFG.projectId){S.state='setup';render()}
else if(!KEY){S.state='login';render()}
else{
  render();
  try{tryKey(KEY,true)}
  catch(e){S.state='error';S.fatal='Не загрузилась библиотека Firebase. Проверьте интернет или откройте ссылку с телефона.';render()}
}
})();
</script>
